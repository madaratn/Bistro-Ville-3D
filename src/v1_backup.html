<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff7a2f">
<title>Bistro Ville</title>
<style>
:root{--accent:#ff7a2f;--accent2:#ffb347;--ink:#3b2a1a;--panel:#fff8ef;--good:#2f9e63;--bad:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd37a;font-family:"Trebuchet MS","Nunito",system-ui,sans-serif;color:var(--ink);touch-action:none;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 8px 6px;display:flex;gap:6px;align-items:center;z-index:5;pointer-events:none;flex-wrap:wrap}
.pill{background:rgba(255,248,239,.96);border-radius:999px;padding:6px 11px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.18);display:flex;align-items:center;gap:5px;font-size:15px;pointer-events:auto;position:relative;overflow:hidden;cursor:pointer}
#xpbar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);transition:width .3s}
#spacer{flex:1}
#bottom,#editbar{position:fixed;left:0;right:0;bottom:0;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:center;gap:5px;z-index:5;flex-wrap:wrap}
#editbar{flex-direction:column;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.25))}
#einfo{background:var(--panel);border-radius:12px;padding:7px 12px;font-weight:700;font-size:14px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.18);max-width:520px}
.erow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.btn{border:none;background:var(--panel);border-radius:16px;padding:6px 4px 5px;min-width:56px;font-weight:800;font-size:11px;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.22);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:inherit;position:relative}
.btn span{font-size:24px;line-height:1}
.btn:active,.b:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.dot{position:absolute;top:2px;right:4px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:1px 5px}
.b{border:none;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 3px 0 #c4561a}
.b.alt{background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.b.green{background:var(--good);box-shadow:0 3px 0 #1f6e44}
.b.red{background:var(--bad);box-shadow:0 3px 0 #a5282c}
.b:disabled{opacity:.45;pointer-events:none}
.b.sm{padding:5px 9px;font-size:12px}
.hide{display:none!important}
#modal{position:fixed;inset:0;background:rgba(40,25,10,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:86vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:22px;max-height:80vh}}
.mh{display:flex;align-items:center;padding:14px 16px 6px}
.mh h2{margin:0;font-size:20px;flex:1}
#mx{border:none;background:#f0e2cf;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;color:var(--ink)}
#tabs{display:flex;gap:6px;padding:4px 14px 8px;overflow-x:auto;flex-shrink:0}
#tabs button{border:none;border-radius:99px;padding:6px 12px;background:#f0e2cf;font-weight:800;font-family:inherit;color:var(--ink);white-space:nowrap;cursor:pointer}
#tabs button.on{background:var(--accent);color:#fff}
#mc{overflow-y:auto;padding:4px 14px 18px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.card{background:#fff;border-radius:14px;padding:8px 6px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px}
.card img{width:70px;height:70px}
.card .nm{font-weight:800;line-height:1.1;min-height:2.2em;display:flex;align-items:center}
.card.lock{opacity:.55}
.sub{font-size:12px;opacity:.75}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:9px;margin-bottom:8px;box-shadow:0 2px 0 rgba(0,0,0,.07)}
.row .emo{font-size:32px;width:42px;text-align:center}
.row .info{flex:1;min-width:0}
.row .t{font-weight:800}
.ings{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.ings span{font-size:12px;background:#f4ece1;border-radius:8px;padding:2px 6px}
.ings span.no{background:#fde2e2;color:#a5282c}
.ings span.ok{background:#dff3e6;color:#1f6e44}
.stars{color:#f5a623;letter-spacing:1px}
h3{margin:12px 0 6px;font-size:15px}
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.plot{background:#9b6a43;border-radius:14px;padding:8px;color:#fff;text-align:center;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.plot .big{font-size:34px}
.bar{width:100%;height:7px;background:rgba(0,0,0,.25);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:#7ee08f}
.qa{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.qa button{text-align:left}
.qa .b.alt.okk{background:#dff3e6;box-shadow:0 3px 0 #2f9e63}
.qa .b.alt.bad{background:#fde2e2;box-shadow:0 3px 0 #e5484d}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 62px);transform:translateX(-50%);background:rgba(59,42,26,.92);color:#fff;padding:8px 14px;border-radius:12px;font-weight:700;z-index:20;font-size:14px;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
input[type=text]{font-family:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:2px solid #e7d6bf;width:100%;-webkit-user-select:text;user-select:text}
.center{text-align:center}
.lvlup{font-size:60px;text-align:center;margin:6px 0}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div class="pill" id="pCoins">🪙 <b id="coins">0</b></div>

  <div class="pill" id="pRate"><span class="stars">★</span> <b id="rate">0</b></div>
  <div id="spacer"></div>
  <div class="pill" id="pSet">⚙️</div>
</div>

<div id="bottom">
  <button class="btn" data-open="shop"><span>🛒</span>Boutique</button>
  <button class="btn" data-open="menu"><span>📖</span>Menu</button>
  <button class="btn" data-open="garden"><span>🌱</span>Jardin<i class="dot hide" id="gDot">!</i></button>
  <button class="btn" data-open="staff"><span>👥</span>Équipe</button>
  <button class="btn" data-open="quiz"><span>❓</span>Quiz<i class="dot hide" id="qDot">!</i></button>
  <button class="btn" id="bEdit"><span>✏️</span>Déco</button>
</div>

<div id="editbar" class="hide">
  <div id="einfo"></div>
  <div class="erow" id="ebtns"></div>
</div>

<div id="modal" class="hide">
  <div class="sheet">
    <div class="mh"><h2 id="mt"></h2><button id="mx">✕</button></div>
    <div id="tabs"></div>
    <div id="mc"></div>
  </div>
</div>
<div id="toast" style="opacity:0"></div>

const NAMES=['Léa','Hugo','Chloé','Lucas','Inès','Nathan','Manon','Yanis','Camille','Théo','Sarah','Adam','Jade','Louis','Zoé','Rayan','Lina','Malik','Emma','Sami'];

/* ---------------- ÉTAT ---------------- */
const SAVE_KEY='bistroville_v1';
function newState(){
 return {v:1,name:'Chez Toi',coins:600,xp:0,level:1,size:8,floor:0,wall:0,ownF:[0],ownW:[0],
  furn:[],nid:1,menu:['salade','pizza','crepe'],dl:{},inv:{laitue:2,tomate:3,ble:3,fromage:1,oeuf:1,lait:1},
  garden:[null,null,null,null],staff:[],quiz:{day:'',n:0,seen:[]},sat:70,served:0,earned:0,
  lastSave:Date.now(),tuto:false,sound:true};
}
let state;
function defaultLayout(){
 const L=[['stove',1,0],['stove',2,0],['counter',4,0],['plant',0,0],['plant',7,0],
  ['table',2,4],['chair',1,4],['chair',3,4],['table',5,4],['chair',5,3],['chair',5,5],
  ['table',6,6],['chair',6,5],['chair',7,6],['flowers',0,7],['plant',0,3]];
 for(const [t,x,y] of L) state.furn.push({id:state.nid++,t,x,y});
 state.staff.push(mkStaffData('chef'),mkStaffData('waiter'));
}
function mkStaffData(role){
 const used=new Set(state.staff.map(s=>s.name));
 const name=pick(NAMES.filter(n=>!used.has(n)))||pick(NAMES);
 return {id:state.nid++,name,role,xp:0,skin:pick(SKINS),hair:pick(HAIRS),body:pick(BODIES)};
}
function save(){ if(!state) return; state.lastSave=Date.now(); try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){} }
function load(){ try{const s=localStorage.getItem(SAVE_KEY); if(s){const o=JSON.parse(s); if(o&&o.v===1) return Object.assign(newState(),o);}}catch(e){} return null; }

/* ---------------- GRILLE & CHEMINS ---------------- */
let S=8, DX=4, occ=new Map();
function setSize(){ S=state.size; DX=Math.floor(S/2); rebuildOcc(); }
function rebuildOcc(){ occ=new Map(); for(const f of state.furn) occ.set(f.x+','+f.y,f); }
const fAt=(x,y)=>occ.get(x+','+y);
const kindOf=f=>FURN[f.t].kind;
const inRest=(x,y)=>x>=0&&y>=0&&x<S&&y<S;
const inWalk=(x,y)=>x>=0&&x<S&&y>=0&&y<=S+1;
function blocked(x,y){ if(!inWalk(x,y)) return true; return y<S && occ.has(x+','+y); }
function doorOK(ax,ay,bx,by){ if((ay===S-1&&by===S)||(ay===S&&by===S-1)) return ax===DX&&bx===DX; return true; }
function bfs(sx,sy,isGoal,goalPass){
 if(!inWalk(sx,sy)) return null;
 if(isGoal(sx,sy)) return [];
 const Wd=S,N=S*(S+2),prev=new Int32Array(N).fill(-2),si=sy*Wd+sx; prev[si]=-1;
 const q=[si]; let h=0;
 while(h<q.length){
  const ci=q[h++], cx=ci%Wd, cy=(ci/Wd)|0;

/* ---------------- ENTRÉES ---------------- */
const ptrs=new Map(); let drag=null,pinch=null,moved=false;
const pd=()=>{const [a,b]=[...ptrs.values()]; return Math.hypot(a.x-b.x,a.y-b.y);};
cv.addEventListener('pointerdown',e=>{
 audioInit();
 try{cv.setPointerCapture(e.pointerId);}catch(_){}
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1){ drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}; moved=false; }
 else if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:pd(),z:cam.z,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,cx:cam.x,cy:cam.y}; moved=true; drag=null; }
});
cv.addEventListener('pointermove',e=>{
 if(!ptrs.has(e.pointerId)){ if(mode==='edit'&&(placing||sel)&&e.pointerType==='mouse'){ const g=screenToGrid(e.clientX,e.clientY); ghost=inRest(g[0],g[1])?{x:g[0],y:g[1]}:ghost; } return; }
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&ptrs.size===2){ const nz=clamp(pinch.z*pd()/pinch.d,.4,2.4); const wx=(pinch.mx-pinch.cx)/pinch.z, wy=(pinch.my-pinch.cy)/pinch.z; cam.z=nz; cam.x=pinch.mx-wx*nz; cam.y=pinch.my-wy*nz; }
 else if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.hypot(dx,dy)>9) moved=true; if(moved){ cam.x=drag.cx+dx; cam.y=drag.cy+dy; } }
});
function endPtr(e){
 if(!ptrs.has(e.pointerId)) return;
 ptrs.delete(e.pointerId);
 if(ptrs.size===0){ if(!moved&&drag&&e.type==='pointerup') tap(e.clientX,e.clientY); drag=null; pinch=null; }
 else if(ptrs.size<2) pinch=null;
}
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{ e.preventDefault(); const nz=clamp(cam.z*(e.deltaY<0?1.1:.9),.4,2.4); const wx=(e.clientX-cam.x)/cam.z, wy=(e.clientY-cam.y)/cam.z; cam.z=nz; cam.x=e.clientX-wx*nz; cam.y=e.clientY-wy*nz; },{passive:false});
function screenToWorld(sx,sy){ return [(sx-cam.x)/cam.z,(sy-cam.y)/cam.z]; }
function screenToGrid(sx,sy){ const [wx,wy]=screenToWorld(sx,sy); const a=wx/32,b=wy/16; return [Math.floor((a+b)/2),Math.floor((b-a)/2)]; }
function tap(sx,sy){
 const [wx,wy]=screenToWorld(sx,sy), [gx,gy]=screenToGrid(sx,sy);
 if(mode==='edit') return editTap(gx,gy);
 for(const it of items){ const p=ctr(it.x,it.y); if(Math.hypot(p[0]-wx,p[1]-14-wy)<26){ state.inv[it.k]=(state.inv[it.k]||0)+1; items=items.filter(i=>i!==it); floatAt(it.x,it.y,'+1 '+ING[it.k].e,'#2f9e63'); toast('Tu as trouvé : '+ING[it.k].e+' '+ING[it.k].n+' !'); sfx('pop'); return; } }
 for(const t of trash){ const p=ctr(t.x,t.y); if(Math.hypot(p[0]-wx,p[1]-4-wy)<22){ trash=trash.filter(x=>x!==t); if(t.tg&&t.tg.job&&t.tg.job.t===t) t.tg.job=null; floatAt(t.x,t.y,'✨ +1 XP','#2f9e63'); addXP(1); sfx('pop'); return; } }
 for(const a of crew){ const p=ctr(a.fx,a.fy); if(Math.hypot(p[0]-wx,p[1]-25-wy)<20){ toast(ROLES[a.s.role].e+' '+a.s.name+' — '+ROLES[a.s.role].n+' niv. '+staffLv(a.s)); return; } }
 for(const c of custs){ const p=ctr(c.fx,c.fy); if(c.st==='wait'&&Math.hypot(p[0]-wx,p[1]-25-wy)<20){ toast('Ce client attend : '+DISHM[c.order.dish].e+' '+DISHM[c.order.dish].n); return; } }
}

function canPlace(x,y,ignore){
 if(!inRest(x,y)) return false;
 if(x===DX&&y===S-1) return false;
 const o=fAt(x,y); if(o&&o!==ignore) return false;
 return true;
}
function placeCheck(x,y,mover,type){
 if(!canPlace(x,y,mover)) return 'Case occupée ou hors du restaurant.';
 let f=mover, ox, oy;
 if(mover){ ox=mover.x; oy=mover.y; mover.x=x; mover.y=y; }
 else { f={id:state.nid,t:type,x,y}; state.furn.push(f); }
 rebuildOcc();
 const ok=layoutOK();
 if(!ok){ if(mover){mover.x=ox;mover.y=oy;} else state.furn.pop(); rebuildOcc(); return 'Ça bloquerait le passage !'; }
 return null;
}
function editTap(x,y){
 if(placing){
  const F=FURN[placing];
  if(state.coins<F.p){ toast('Pas assez de pièces !'); placing=null; ghost=null; editBar(); return; }
  {
   const err=placeCheck(x,y,null,placing);
   if(err){ ghost={x,y}; toast(err); return; }
   state.nid++; state.coins-=F.p; sfx('pop'); floatAt(x,y,'-'+F.p+' 🪙','#e5484d');
   if(state.coins<F.p){ placing=null; ghost=null; }
   editBar(); hud(); return;
  }
 }
 const f=fAt(x,y);
 if(sel&&!f&&inRest(x,y)){
  const err=placeCheck(x,y,sel,null);
  if(err){ toast(err); return; } sfx('pop'); sel=null; ghost=null; editBar(); return;
 }
 if(f){ sel=(sel===f)?null:f; ghost=null; editBar(); return; }
 sel=null; ghost=null; editBar();
}

 else if(sel){ const F=FURN[sel.t]; info=`<b>${F.n}</b> — touche une case libre pour le déplacer`; btns=`<button class="b red" data-e="sell">Vendre +${Math.floor(F.p/2)} 🪙</button><button class="b alt" data-e="desel">OK</button>`; }
 else { info='Mode déco : touche un meuble pour le sélectionner'; btns=`<button class="b alt" data-e="shop">🛒 Boutique</button><button class="b green" data-e="done">✔ Terminer</button>`; }

 }

});

  const row=(e,t,v,mx,tip)=>`<div class="row"><div class="emo">${e}</div><div class="info"><div class="t">${t}</div><div class="bar" style="background:#eee"><i style="width:${clamp(v/mx,0,1)*100}%;background:#ffb347"></i></div><div class="sub">${tip}</div></div></div>`;

  html+=row('🪴','Décoration',rParts.d,1.5,'Achète des meubles et de la déco (proportionnel à la taille du resto).');
  html+=row('🍽️','Qualité du menu',rParts.m,1.2,'Améliore le niveau de tes recettes.');
  html+=row('😊','Satisfaction des clients',rParts.s,1.5,`Satisfaction moyenne : ${Math.round(state.sat)}%. Sers vite !`);
  html+=`<div class="row"><div class="emo">🧹</div><div class="info"><div class="t">Propreté</div><div class="sub">${rParts.dirt>0?`Malus : -${rParts.dirt.toFixed(1)} (déchets et tables sales)`:'Impeccable ✨'}</div></div></div>`;
  return {title:'⭐ Note du restaurant',html};
 },
 settings(){
  let html=`<h3>Nom du restaurant</h3><div style="display:flex;gap:8px"><input type="text" id="rname" maxlength="16" value="${state.name.replace(/"/g,'&quot;')}"><button class="b" data-a="rename">OK</button></div>`;
  html+=`<h3>Options</h3><div class="row"><div class="info"><div class="t">🔊 Sons</div></div><button class="b sm ${state.sound?'green':'alt'}" data-a="sound">${state.sound?'Activés':'Coupés'}</button></div>`;
  html+=`<div class="row"><div class="info"><div class="t">🎯 Recentrer la caméra</div></div><button class="b sm alt" data-a="recenter">Recentrer</button></div>`;
  html+=`<h3>Statistiques</h3><div class="row"><div class="info">🍽️ Clients servis : <b>${fmt(state.served)}</b><br>🪙 Pièces gagnées : <b>${fmt(state.earned)}</b><br>👥 Employés : <b>${state.staff.length}</b></div></div>`;
  html+=`<h3>Comment jouer</h3><div class="row"><div class="info sub" style="opacity:1">Les clients entrent, s'assoient et commandent un plat de ton menu. Tes cuisiniers cuisinent, tes serveurs servent. Gagne des pièces et de l'XP, décore avec la Boutique, cultive des ingrédients au Jardin pour améliorer tes recettes et fais grimper la note de ton restaurant ! Fais glisser pour te déplacer, pince (ou molette) pour zoomer.</div></div>`;
  html+=`<h3>Danger</h3><button class="b red" data-a="reset">${ui.cr?'Sûr ? Touche encore pour tout effacer':'Recommencer à zéro'}</button>`;
  html+=`<p class="sub center">Bistro Ville — prototype v0.1</p>`;
  return {title:'⚙️ Réglages',html};
 },
};
function fmtT(s){ s=Math.max(0,Math.ceil(s)); return s>=60?Math.floor(s/60)+' min '+(s%60?String(s%60).padStart(2,'0')+' s':''):s+' s'; }
function newQuestion(){
 const seen=state.quiz.seen||[]; const pool=QUIZ.map((_,i)=>i).filter(i=>!seen.includes(i));
 ui.q=pick(pool.length?pool:QUIZ.map((_,i)=>i)); ui.qa=null; ui.qo=[0,1,2,3].sort(()=>Math.random()-.5);
}
const ACT={
 close:()=>closeModal(),
 tab:v=>{ui.tab=v; ui.plot=null; $('#mc').scrollTop=0; renderPanel();},
 buy:k=>{ const F=FURN[k]; if(state.coins<F.p) return toast('Pas assez de pièces !'); closeModal(); if(mode!=='edit') enterEdit(); placing=k; sel=null; ghost=null; editBar(); },
 buyF:i=>{ i=+i; const f=FLOORS[i]; if(state.coins<f.p) return toast('Pas assez de pièces !'); state.coins-=f.p; state.ownF.push(i); state.floor=i; sfx('coin'); },
 useF:i=>{state.floor=+i;},
 buyW:i=>{ i=+i; const f=WALLS[i]; if(state.coins<f.p) return toast('Pas assez de pièces !'); state.coins-=f.p; state.ownW.push(i); state.wall=i; sfx('coin'); },
 useW:i=>{state.wall=+i;},
 expand:s=>{ s=+s; const e=EXP.find(x=>x.s===s); if(state.coins<e.p) return toast('Pas assez de pièces !'); state.coins-=e.p; state.size=s; for(const c of custs) if(c.order) c.order.cancel=true; custs=[]; orders=[]; items=[]; setSize(); resetSim(); centerCam(); sfx('level'); toast('📐 Restaurant agrandi en '+s+'×'+s+' !'); closeModal(); },
 remMenu:id=>{ if(state.menu.length>1) state.menu=state.menu.filter(x=>x!==id); },
 addMenu:id=>{ if(state.menu.length<menuSlots()&&!state.menu.includes(id)){ state.menu.push(id); toast(DISHM[id].e+' ajouté au menu !'); } },
 upg:id=>{ const d=DISHM[id], L=lvl(id); if(L>=10||!d.ing.every(k=>(state.inv[k]||0)>=L)) return; d.ing.forEach(k=>state.inv[k]-=L); state.dl[id]=L+1; addXP(5*L); sfx('level'); toast(d.e+' '+d.n+' passe niveau '+(L+1)+' !'); },
 plot:i=>{ui.plot=+i;},
 unplot:()=>{ui.plot=null;},
 seed:k=>{ const I=ING[k]; if(state.coins<I.g.c||ui.plot==null) return; state.coins-=I.g.c; state.garden[ui.plot]={k,at:Date.now()}; ui.plot=null; sfx('pop'); },
 harvest:i=>{ i=+i; const p=state.garden[i]; if(!p) return; const I=ING[p.k]; state.inv[p.k]=(state.inv[p.k]||0)+I.g.y; state.garden[i]=null; addXP(2); sfx('coin'); toast('Récolte : +'+I.g.y+' '+I.e+' '+I.n); },
 buyPlot:()=>{ if(state.coins<plotCost()||state.garden.length>=maxPlots()) return; state.coins-=plotCost(); state.garden.push(null); sfx('coin'); },
 mkt:v=>{ const [k,n]=v.split(':'), q=+n, c=ING[k].b*(q===5?4:1); if(state.coins<c) return; state.coins-=c; state.inv[k]=(state.inv[k]||0)+q; sfx('coin'); },
 role:id=>{ const s=state.staff.find(x=>x.id==id); const rs=Object.keys(ROLES).filter(r=>state.level>=ROLES[r].u); s.role=rs[(rs.indexOf(s.role)+1)%rs.length]; const a=crew.find(c=>c.s===s); if(a){ if(a.job&&a.job.o){ a.job.o.st='wait'; a.job.o.chef=null; a.job.o.waiter=null; a.job.o.at=null; } if(a.job&&a.job.stove) stoveBusy.delete(a.job.stove.id); if(a.job&&a.job.table) cleaning.delete(a.job.table.id); if(a.job&&a.job.t&&a.job.t.tg) a.job.t.tg=null; a.job=null; a.carry=null; a.path=[]; } },
 fire:id=>{ const s=state.staff.find(x=>x.id==id); if(!s||state.staff.length<=1) return; state.staff=state.staff.filter(x=>x!==s); resetSim(); crew=crew.filter(a=>a.s!==s); toast(s.name+' a quitté l\'équipe.'); },
 hire:r=>{ const c=hireCost(); if(state.coins<c||state.staff.length>=maxStaff()) return; state.coins-=c; const s=mkStaffData(r); state.staff.push(s); crew.push(mkCrew(s)); sfx('coin'); toast(ROLES[r].e+' '+s.name+' rejoint ton équipe !'); },
 ans:i=>{ i=+i; if(ui.qa!=null) return; ui.qa=i; state.quiz.n++; state.quiz.seen=[...(state.quiz.seen||[]),ui.q].slice(-15);
  if(i===0){ const rare=Object.keys(ING).filter(k=>ING[k].b), k=pick(rare), k2=pick(Object.keys(ING)); state.inv[k]=(state.inv[k]||0)+1; state.inv[k2]=(state.inv[k2]||0)+1; ui.qr=`+1 ${ING[k].e} +1 ${ING[k2].e}`; addXP(10); sfx('level'); } else sfx('bad'); },
 nextQ:()=>{ ui.q=null; ui.qa=null; },
 rename:()=>{ const v=($('#rname').value||'').trim().slice(0,16); if(v){ state.name=v; toast('Bienvenue « '+v+' » !'); } },
 sound:()=>{state.sound=!state.sound;},
 recenter:()=>{centerCam(); closeModal();},
 reset:()=>{ if(!ui.cr){ui.cr=true; return;} ui.cr=false; try{localStorage.removeItem(SAVE_KEY);}catch(e){} state=newState(); setSize(); defaultLayout(); rebuildOcc(); custs=[];orders=[];trash=[];items=[];dirty.clear(); buildCrew(); centerCam(); closeModal(); showTuto(); },
};
$('#modal').addEventListener('click',e=>{
 if(e.target.id==='modal'||e.target.id==='mx') return closeModal();
 const b=e.target.closest('[data-a]'); if(!b) return;
 const a=b.dataset.a; if(ACT[a]){ ACT[a](b.dataset.v); if(ui.panel&&a!=='close'&&a!=='recenter'&&a!=='buy'&&a!=='expand') renderPanel(); hud(); }
});
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{audioInit(); if(b.dataset.open==='quiz'){ui.q=null;} openPanel(b.dataset.open);});
$('#pRate').onclick=()=>openPanel('rating');
$('#pSet').onclick=()=>{ui.cr=false; openPanel('settings');};
$('#pLvl').onclick=()=>toast(`Niveau ${state.level} — ${Math.floor(state.xp)}/${xpNeed(state.level)} XP`);
$('#pCoins').onclick=()=>toast('Gagne des pièces en servant tes clients !');
let toastT=0;
function toast(s){ const t=$('#toast'); t.textContent=s; t.style.opacity=1; clearTimeout(toastT); toastT=setTimeout(()=>t.style.opacity=0,2200); }
function hud(){
 $('#coins').textContent=fmt(state.coins); $('#lvl').textContent=state.level;
 $('#xpbar').style.width=(state.xp/xpNeed(state.level)*100)+'%';
 $('#rate').textContent=(Math.round(rating*10)/10).toFixed(1);
 const now=Date.now(); $('#gDot').classList.toggle('hide',!state.garden.some(p=>p&&(now-p.at)/1000>=ING[p.k].g.t));
 $('#qDot').classList.toggle('hide',quizLeft()<=0);
}
function showTuto(){
 queueModal(()=>({title:'Bienvenue dans Bistro Ville !',html:`<div class="lvlup">🧑‍🍳</div>
 <p>Tu viens d'ouvrir ton tout premier restaurant, <b>${state.name}</b>. Voici comment ça marche :</p>
 <div class="row"><div class="emo">🙋</div><div class="info">Les clients arrivent par la rue, s'assoient et commandent un plat de ton <b>menu</b>.</div></div>
 <div class="row"><div class="emo">👨‍🍳</div><div class="info">Ton <b>cuisinier</b> prépare le plat au fourneau, ton <b>serveur</b> l'apporte. Sers vite avant que les clients perdent patience !</div></div>
 <div class="row"><div class="emo">🌱</div><div class="info">Cultive des ingrédients au <b>Jardin</b> (ou gagne-les au <b>Quiz</b>) pour améliorer tes recettes.</div></div>
 <div class="row"><div class="emo">✏️</div><div class="info">Achète des meubles et décore en mode <b>Déco</b> pour faire monter ta <span class="stars">★</span> note.</div></div>
 <p class="sub">Fais glisser pour te déplacer, pince pour zoomer. Ta partie est sauvegardée automatiquement.</p>
 <p class="center"><button class="b" data-a="close">C'est parti !</button></p>`}));
 state.tuto=true;
}

/* ---------------- SON ---------------- */
let AC=null;
function audioInit(){ if(AC) return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function tone(f,t0,d,type,v){ const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(v||.08,AC.currentTime+t0); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t0+d); o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+t0); o.stop(AC.currentTime+t0+d+.02); }
function sfx(k){
 if(!state||!state.sound||!AC) return;
 try{
  if(k==='coin'){ tone(988,0,.08,'square',.04); tone(1319,.07,.16,'square',.04); }
  else if(k==='pop'){ tone(520,0,.08,'sine',.08); tone(780,.04,.08,'sine',.06); }
  else if(k==='level'){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.18,'triangle',.07)); }
  else if(k==='bad'){ tone(300,0,.15,'sawtooth',.04); tone(220,.12,.2,'sawtooth',.04); }
 }catch(e){}
}

/* ---------------- BOUCLE ---------------- */
let last=performance.now(),acc=0,saveAcc=0,gAcc=0;
function frame(t){
 const dt=Math.min(.1,(t-last)/1000); last=t;
 if(mode==='play') update(dt);
 for(const f of floaters) f.t-=dt; floaters=floaters.filter(f=>f.t>0);
 render();
 acc+=dt; if(acc>.5){ acc=0; calcRating(); hud(); }
 gAcc+=dt; if(gAcc>1){ gAcc=0; if(ui.panel==='garden'&&ui.tab==='potager'&&ui.plot==null) renderPanel(); }
 saveAcc+=dt; if(saveAcc>15){ saveAcc=0; save(); }
 requestAnimationFrame(frame);
}
function boot(){
 const loaded=load();
 state=loaded||newState();
 setSize();
 if(!loaded) defaultLayout();
 rebuildOcc(); buildCrew();
 resize(); centerCam(); makeThumbs(); calcRating(); hud();
 if(!state.tuto) showTuto();
 else {
  const away=(Date.now()-state.lastSave)/1000;
  if(away>120){
   const mins=Math.min(away/60,480), avg=state.menu.reduce((s,id)=>s+dishPrice(DISHM[id]),0)/Math.max(1,state.menu.length);
   const gain=Math.floor(mins*Math.max(1,seatCount())*avg*.12);
   if(gain>0){ earn(gain); queueModal(()=>({title:'Bon retour !',html:`<div class="lvlup">💰</div><p class="center">Pendant ton absence (${fmtT(Math.min(away,28800))}), ton équipe a fait tourner <b>${state.name}</b> et a gagné<br><b style="font-size:26px">${fmt(gain)} 🪙</b></p><p class="center"><button class="b" data-a="close">Merci l'équipe !</button></p>`})); }
  }
 }
 save();
 requestAnimationFrame(frame);
}
addEventListener('resize',()=>{resize();});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
addEventListener('pagehide',save);
boot();
</script>
