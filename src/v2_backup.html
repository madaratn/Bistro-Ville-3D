:root{--accent:#ff7a2f;--accent2:#ff9f45;--ink:#3a2a1f;--muted:#8a7766;--panel:#fffcf7;--line:#f1e7da;--good:#2fae6e;--bad:#e5484d;--shadow:0 8px 24px rgba(80,45,15,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#a5d97a;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:500;color:var(--ink);touch-action:none;overscroll-behavior:none}
button{font-family:inherit}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.hide{display:none!important}
/* HUD */
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 10px 6px;display:flex;gap:7px;align-items:center;z-index:5;pointer-events:none}
.pill{background:rgba(255,252,247,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;height:38px;padding:0 13px 0 6px;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:7px;font-size:16px;pointer-events:auto;cursor:pointer;border:none;color:var(--ink)}
.pill.round{width:38px;padding:0;justify-content:center}
.pill.round svg{width:20px;height:20px;stroke:var(--ink)}
#spacer{flex:1}
.coin{display:inline-block;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c0 0,#ffd23f 38%,#f0a612 100%);box-shadow:inset 0 0 0 2.5px rgba(190,115,0,.35),0 2px 0 #c98a0c;flex-shrink:0;vertical-align:-6px}
.coin.sm{width:15px;height:15px;box-shadow:inset 0 0 0 1.5px rgba(190,115,0,.35),0 1.5px 0 #c98a0c;vertical-align:-2px;margin-left:2px}
.lvb{width:28px;height:28px;border-radius:50%;background:linear-gradient(145deg,#8f7bff,#5a46e0);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #3f2fb8}
.xpw{width:62px;height:8px;border-radius:9px;background:#eee4d6;overflow:hidden}
#xpbar{height:100%;width:0;background:linear-gradient(90deg,#8f7bff,#b59cff);border-radius:9px;transition:width .4s}
.star{width:24px;height:24px;background:linear-gradient(160deg,#ffe066,#ffb000);clip-path:polygon(50% 3%,62% 36%,97% 37%,69% 58%,79% 93%,50% 72%,21% 93%,31% 58%,3% 37%,38% 36%);flex-shrink:0}
/* Dock */
#bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:2px;z-index:5;background:rgba(255,252,247,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:7px;border-radius:26px;box-shadow:0 10px 30px rgba(80,45,15,.2)}
.nb{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:56px;padding:2px 0;cursor:pointer;color:var(--ink);font-size:11px;font-weight:600;position:relative}

let S=8, DX=4, occ=new Map();
function setSize(){ S=state.size; DX=Math.floor(S/2); rebuildOcc(); }
function rebuildOcc(){ occ=new Map(); for(const f of state.furn) occ.set(f.x+','+f.y,f); }
const fAt=(x,y)=>occ.get(x+','+y);
const kindOf=f=>FURN[f.t].kind;
const inRest=(x,y)=>x>=0&&y>=0&&x<S&&y<S;
const inWalk=(x,y)=>x>=0&&x<S&&y>=0&&y<=S+1;
function blocked(x,y){ if(!inWalk(x,y)) return true; return y<S && occ.has(x+','+y); }
function doorOK(ax,ay,bx,by){ if((ay===S-1&&by===S)||(ay===S&&by===S-1)) return ax===DX&&bx===DX; return true; }
function bfs(sx,sy,isGoal,goalPass){
 if(!inWalk(sx,sy)) return null;
 if(isGoal(sx,sy)) return [];
 const Wd=S,N=S*(S+2),prev=new Int32Array(N).fill(-2),si=sy*Wd+sx; prev[si]=-1;
 const q=[si]; let h=0;
 while(h<q.length){
  const ci=q[h++], cx=ci%Wd, cy=(ci/Wd)|0;
  for(const [dx,dy] of D4){
   const nx=cx+dx, ny=cy+dy; if(!inWalk(nx,ny)) continue;
   const ni=ny*Wd+nx; if(prev[ni]!==-2) continue;
   if(!doorOK(cx,cy,nx,ny)) continue;
   const g=isGoal(nx,ny);
   if(blocked(nx,ny)&&!(g&&goalPass)) continue;
   prev[ni]=ci;
   if(g){ const p=[]; let k=ni; while(k!==si){p.push([k%Wd,(k/Wd)|0]); k=prev[k];} return p.reverse(); }
   q.push(ni);
  }
 }
 return null;
}
function pathToFurn(a,f){ return bfs(a.x,a.y,(x,y)=>inRest(x,y)&&!blocked(x,y)&&Math.abs(x-f.x)<=1&&Math.abs(y-f.y)<=1&&!(x===f.x&&y===f.y),false); }
function nearestFree(x,y){
 for(let r=0;r<=S+2;r++) for(let dx=-r;dx<=r;dx++) for(let dy=-r;dy<=r;dy++){
  if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue; const nx=x+dx, ny=y+dy;
  if(inRest(nx,ny)&&!blocked(nx,ny)) return [nx,ny];
 }
 return [DX,S-1];
}
function seatTable(ch){ for(const [dx,dy] of D4){ const f=fAt(ch.x+dx,ch.y+dy); if(f&&kindOf(f)==='table') return f; } return null; }
function seatCount(){ return state.furn.filter(f=>kindOf(f)==='chair'&&seatTable(f)).length; }
// Vérifie que tout reste accessible depuis la porte
function layoutOK(){
 if(blocked(DX,S-1)) return false;
 const seen=new Set([DX+','+(S-1)]), q=[[DX,S-1]];
 while(q.length){ const [x,y]=q.pop(); for(const [dx,dy] of D4){ const nx=x+dx, ny=y+dy, k=nx+','+ny; if(inRest(nx,ny)&&!seen.has(k)&&!blocked(nx,ny)){seen.add(k);q.push([nx,ny]);} } }
 for(const f of state.furn){
  const k=kindOf(f); if(!['chair','stove','counter','table'].includes(k)) continue;
  let ok=false;
  for(let dx=-1;dx<=1&&!ok;dx++) for(let dy=-1;dy<=1&&!ok;dy++){
   if(!dx&&!dy) continue; if(k==='chair'&&dx&&dy) continue;
   if(seen.has((f.x+dx)+','+(f.y+dy))) ok=true;
  }
  if(!ok) return false;
 }
 return true;
}

let custs=[],crew=[],orders=[],trash=[],items=[],floaters=[];
let dirty=new Map(),stoveBusy=new Set(),cleaning=new Set();
let spawnT=2,passT=3,itemT=15,rating=2.5,rParts={d:0,m:0,s:0,dirt:0},uid=1;
let mode='play',placing=null,sel=null,ghost=null;

function mkAgent(o){return Object.assign({x:0,y:0,fx:0,fy:0,path:[],speed:2.2,ph:Math.random()*6,dir:1,moving:false},o);}
function moveAgent(a,dt){
 if(!a.path.length) return true;
 const n=a.path[0], dx=n[0]-a.fx, dy=n[1]-a.fy, d=Math.hypot(dx,dy), st=a.speed*dt;
 a.moving=true; a.ph+=dt*7;
 if(Math.abs(dx-dy)>.01) a.dir=(dx-dy)>0?1:-1;
 if(Math.abs(dx+dy)>.01) a.back=(dx+dy)<0;
 if(d<=st){ a.fx=a.x=n[0]; a.fy=a.y=n[1]; a.path.shift(); return !a.path.length; }
 a.fx+=dx/d*st; a.fy+=dy/d*st; return false;
}
const PANTS=['#3b4a6b','#5a4632','#2f2f3a','#6b5b95','#7a8a99','#2e5d4b'];
function randLook(){return {skin:pick(SKINS),hair:pick(HAIRS),body:pick(BODIES),pants:pick(PANTS),hs:ri(0,3),gl:Math.random()<.15,hat:Math.random()<.12?pick(['#e5484d','#3a3f4b','#f7b84f','#4f8ff7']):null};}
const staffLv=s=>Math.min(5,1+Math.floor(s.xp/25));
const staffMul=a=>1+.12*(staffLv(a.s)-1);
function mkCrew(s){ const p=nearestFree(2,1); return mkAgent({kind:'staff',s,x:p[0],y:p[1],fx:p[0],fy:p[1],look:{skin:s.skin,hair:s.hair,body:s.body,hs:s.hs??(s.id%4)},job:null,idle:0}); }
function buildCrew(){ crew=state.staff.map(mkCrew); }
function gainStaff(a){ const b=staffLv(a.s); a.s.xp++; if(staffLv(a.s)>b){ floatAt(a.fx,a.fy,'⬆️ '+a.s.name,'#2f9e63'); } a.speed=2.4*staffMul(a); }

function takenSeats(){ return new Set(custs.filter(c=>c.seat).map(c=>c.seat.id)); }
function tryGetSeat(c){
 const tk=takenSeats();
 const seats=state.furn.filter(f=>kindOf(f)==='chair'&&!tk.has(f.id)&&seatTable(f));
 for(let i=0;i<4&&seats.length;i++){
  const s=seats.splice(Math.floor(Math.random()*seats.length),1)[0];
  const p=bfs(c.x,c.y,(x,y)=>x===s.x&&y===s.y,true);
  if(p){ c.seat=s; c.sx=s.x; c.sy=s.y; c.path=p; c.st='walkIn'; return true; }
 }
 return false;
}
function spawnCust(pass){
 const sx=Math.random()<.5?0:S-1;
 const c=mkAgent({id:uid++,kind:'cust',look:randLook(),x:sx,y:S+1,fx:sx,fy:S+1,speed:rnd(1.8,2.4),ex:Math.random()<.5?0:S-1,pat:100});
 if(pass||!tryGetSeat(c)){
  const q=custs.filter(k=>k.st==='queue').length;
  if(!pass&&q<4){ c.st='queue'; const qx=clamp(DX+ri(-2,2),0,S-1); c.path=bfs(c.x,c.y,(x,y)=>x===qx&&y===S,false)||[]; }
  else { c.st='pass'; c.ex=S-1-sx; c.path=bfs(c.x,c.y,(x,y)=>x===c.ex&&y===S+1,false)||[]; if(!c.path.length) return; }
 }
 custs.push(c);
}
function leave(c){
 c.st='leave'; c.sitting=false; c.seat=null;
 c.path=bfs(c.x,c.y,(x,y)=>x===c.ex&&y===S+1,false)||[];
 if(!c.path.length&&!(c.y===S+1)) c.dead=true;
}
function patRate(){ return 2.6-rating*.25; }
function addSat(v){ state.sat=state.sat*.9+v*.1; }
function sitDown(c){
 c.sitting=true; c.table=seatTable(c.seat);
 if(c.table) faceTo(c,c.table);
 c.dirtyStart=c.table&&(dirty.get(c.table.id)||0)>0;
 const o={id:uid++,c,dish:pick(state.menu),st:'wait'};
 c.order=o; c.pat=100; c.st='wait'; orders.push(o);
}
function angry(c){
 if(c.order){c.order.cancel=true;c.order=null;}
 addSat(0); c.mood='angry'; floatAt(c.fx,c.fy,'😠','#e5484d'); leave(c);
}
function serve(o){ const c=o.c; o.st='served'; c.st='eat'; c.t=rnd(5,7); sfx('pop'); }
function finishMeal(c){
 const d=DISHM[c.order.dish], L=lvl(d.id), price=dishPrice(d);
 let sat=40+c.pat*.35+L*2.5+rParts.d*8-(c.dirtyStart?12:0); sat=clamp(sat,0,100);
 const tip=sat>70?Math.round(price*(sat-70)/100):0;
 earn(price+tip); addXP(3+Math.round(price/12)); addSat(sat); state.served++;
 floatAt(c.fx,c.fy,'+'+(price+tip),null,true); sparkle(c.fx,c.fy,6); c.mood='happy';
 floatAt(c.fx,c.fy-.6,sat>80?'😍':sat>60?'😊':sat>40?'😐':'😕');
 sfx('coin');
 if(c.table&&state.furn.includes(c.table)) dirty.set(c.table.id,(dirty.get(c.table.id)||0)+1);
 if(Math.random()<.15){ const opts=D4.map(([dx,dy])=>[c.x+dx,c.y+dy]).filter(([x,y])=>inRest(x,y)&&!blocked(x,y)&&!trash.some(t=>t.x===x&&t.y===y)); if(opts.length){const [x,y]=pick(opts); trash.push({id:uid++,x,y,e:pick(['🍌','🧻','🥤','🍂'])});} }
 c.order=null; leave(c); c.back=false;
}
function updCust(c,dt){
 c.moving=false;
 switch(c.st){
  case 'pass': case 'leave': if(moveAgent(c,dt)) c.dead=true; break;
  case 'queue':
   moveAgent(c,dt); c.pat-=dt*2.2; c.tt=(c.tt||0)-dt;
   if(c.tt<=0){ c.tt=.7; if(tryGetSeat(c)) break; }
   if(c.pat<=0){ addSat(20); floatAt(c.fx,c.fy,'😤'); leave(c); }
   break;
  case 'walkIn':
   if(moveAgent(c,dt)){ if(c.seat&&c.x===c.seat.x&&c.y===c.seat.y) sitDown(c); else leave(c); }
   break;
  case 'wait': c.pat-=dt*patRate(); if(c.pat<=0) angry(c); break;
  case 'eat': c.t-=dt; if(c.t<=0) finishMeal(c); break;
 }
}
function bestPath(a,list){ let bf=null,bp=null; for(const f of list){ const p=pathToFurn(a,f); if(p&&(!bp||p.length<bp.length)){bf=f;bp=p;} } return bf?{f:bf,p:bp}:null; }
function faceTo(a,f){ const dx=f.x-a.x, dy=f.y-a.y; if(dx-dy) a.dir=(dx-dy)>0?1:-1; a.back=(dx+dy)<0; }
function chefAI(a,dt){
 const j=a.job;
 if(!j){
  const o=orders.find(o=>o.st==='wait'); if(!o) return;
  const r=bestPath(a,state.furn.filter(f=>kindOf(f)==='stove'&&!stoveBusy.has(f.id))); if(!r) return;
  o.st='cooking'; o.chef=a; stoveBusy.add(r.f.id); a.job={o,s:'go',stove:r.f,t:0,T:1}; a.path=r.p; return;
 }
 const o=j.o;
 if(o.cancel){ stoveBusy.delete(j.stove.id); a.job=null; a.carry=null; return; }
 if(j.s==='go'){ if(moveAgent(a,dt)){ j.s='cook'; j.T=j.t=DISHM[o.dish].t/(FURN[j.stove.t].speed||1)/staffMul(a); faceTo(a,j.stove);} }
 else if(j.s==='cook'){
  j.t-=dt;
  if(j.t<=0){
   stoveBusy.delete(j.stove.id); gainStaff(a);
   const r=bestPath(a,state.furn.filter(f=>kindOf(f)==='counter'&&orders.filter(x=>x.st==='ready'&&x.at===f).length<3));
   if(r){ j.s='bring'; j.ctr=r.f; a.path=r.p; a.carry=DISHM[o.dish].e; }
   else { o.st='ready'; o.at=j.stove; a.job=null; }
  }
 }
 else if(j.s==='bring'){ if(moveAgent(a,dt)){ o.st='ready'; o.at=j.ctr; a.carry=null; a.job=null; faceTo(a,j.ctr);} }
}
function dirtyJob(a){
 for(const [id] of dirty){ if(cleaning.has(id)) continue; const f=state.furn.find(f=>f.id===id); if(!f) continue; const p=pathToFurn(a,f); if(p){ cleaning.add(id); a.job={s:'clean',table:f}; a.path=p; return true; } }
 return false;
}
function finishClean(a,j){ dirty.delete(j.table.id); cleaning.delete(j.table.id); floatAt(j.table.x,j.table.y,'✨'); gainStaff(a); faceTo(a,j.table); a.job=null; }
function waiterAI(a,dt){
 const j=a.job;
 if(!j){
  const o=orders.find(o=>o.st==='ready'&&!o.waiter);
  if(o){ const p=pathToFurn(a,o.at); if(p){ o.waiter=a; a.job={o,s:'pick'}; a.path=p; return; } }
  if(dirtyJob(a)) return;
  if(!crew.some(c=>c.s.role==='cleaner')&&trash.length>2) trashJob(a);
  return;
 }
 if(j.s==='clean'){ if(moveAgent(a,dt)) finishClean(a,j); return; }
 if(j.s==='trash') return doTrash(a,j,dt);
 const o=j.o;
 if(o.cancel){ a.job=null; a.carry=null; return; }
 if(j.s==='pick'){ if(moveAgent(a,dt)){ o.st='carried'; a.carry=DISHM[o.dish].e; a.path=(o.c.seat&&pathToFurn(a,o.c.seat))||[]; j.s='serve'; } }
 else if(j.s==='serve'){ if(moveAgent(a,dt)){ serve(o); faceTo(a,o.c); a.carry=null; a.job=null; gainStaff(a);} }
}
function trashJob(a){
 const t=trash.find(t=>!t.tg); if(!t) return false;
 const p=bfs(a.x,a.y,(x,y)=>x===t.x&&y===t.y,false); if(!p) return false;
 t.tg=a; a.job={s:'trash',t}; a.path=p; return true;
}
function doTrash(a,j,dt){ if(!trash.includes(j.t)){a.job=null;return;} if(moveAgent(a,dt)){ trash=trash.filter(t=>t!==j.t); floatAt(a.fx,a.fy,'✨'); gainStaff(a); a.job=null; } }
function cleanerAI(a,dt){
 const j=a.job;
 if(!j){
  if(trashJob(a)) return;
  dirtyJob(a); return;
 }
 if(j.s==='clean'){ if(moveAgent(a,dt)) finishClean(a,j); return; }
 if(j.s==='trash') doTrash(a,j,dt);
}
function updStaff(a,dt){
 a.moving=false; a.speed=2.4*staffMul(a);
 const r=a.s.role;
 if(r==='chef') chefAI(a,dt); else if(r==='waiter') waiterAI(a,dt); else cleanerAI(a,dt);
 if(!a.job){
  a.idle+=dt;
  if(a.path.length) moveAgent(a,dt);
  else if(a.idle>(r==='cleaner'?5:3)&&!a.homed){
   a.homed=r!=='cleaner'; a.idle=0;
   let p=null;
   if(r==='cleaner'){ const x=ri(0,S-1),y=ri(0,S-1); if(!blocked(x,y)) p=bfs(a.x,a.y,(X,Y)=>X===x&&Y===y,false); }
   else { const h=state.furn.find(f=>kindOf(f)===(r==='chef'?'stove':'counter')); if(h) p=pathToFurn(a,h); }
   if(p) a.path=p;
  }
 } else { a.idle=0; a.homed=false; }
}
function spawnItem(){
 const k=pick(Object.keys(ING));
 items.push({id:uid++,x:ri(0,S-1),y:ri(S,S+1),k,t:25});
}
function update(dt){
 spawnT-=dt;
 if(spawnT<=0){
  spawnT=rnd(.75,1.25)*9/(.6+rating*.4);
  const active=custs.filter(c=>c.st!=='pass'&&c.st!=='leave').length;
  if(state.menu.length&&active<seatCount()+3) spawnCust(false);
 }
 passT-=dt; if(passT<=0){ passT=rnd(5,12); spawnCust(true); }
 itemT-=dt; if(itemT<=0){ itemT=rnd(30,55); spawnItem(); }
 for(const c of custs) updCust(c,dt);
 custs=custs.filter(c=>!c.dead);
 for(const a of crew) updStaff(a,dt);
 orders=orders.filter(o=>!o.cancel&&o.st!=='served');
 for(const it of items) it.t-=dt; items=items.filter(i=>i.t>0);
}
function resetSim(){
 stoveBusy.clear(); cleaning.clear();
 for(const t of trash) t.tg=null;
 for(const o of orders) if(!o.cancel){ o.st='wait'; o.chef=null; o.waiter=null; o.at=null; }
 for(const a of crew){ a.job=null; a.carry=null; a.path=[]; a.homed=false; a.fx=a.x; a.fy=a.y; if(!inRest(a.x,a.y)||blocked(a.x,a.y)){ const n=nearestFree(a.x,a.y); a.x=a.fx=n[0]; a.y=a.fy=n[1]; } }
 for(const id of [...dirty.keys()]) if(!state.furn.find(f=>f.id===id)) dirty.delete(id);
 for(const c of custs){
  c.path=[]; c.fx=c.x; c.fy=c.y;
  const seatOK=c.seat&&state.furn.includes(c.seat)&&c.seat.x===c.sx&&c.seat.y===c.sy&&seatTable(c.seat);
  if(!c.sitting&&c.y<S&&blocked(c.x,c.y)){ const n=nearestFree(c.x,c.y); c.x=c.fx=n[0]; c.y=c.fy=n[1]; }
  if(c.st==='walkIn'){
   const p=seatOK&&bfs(c.x,c.y,(x,y)=>x===c.seat.x&&y===c.seat.y,true);
   if(p) c.path=p; else leave(c);
  } else if(c.st==='wait'||c.st==='eat'){

function canPlace(x,y,ignore){
 if(!inRest(x,y)) return false;
 if(x===DX&&y===S-1) return false;
 const o=fAt(x,y); if(o&&o!==ignore) return false;
 return true;
}
function placeCheck(x,y,mover,type){
 if(!canPlace(x,y,mover)) return 'Case occupée ou hors du restaurant.';
 let f=mover, ox, oy;
 if(mover){ ox=mover.x; oy=mover.y; mover.x=x; mover.y=y; }
 else { f={id:state.nid,t:type,x,y}; state.furn.push(f); }
 rebuildOcc();
 const ok=layoutOK();
 if(!ok){ if(mover){mover.x=ox;mover.y=oy;} else state.furn.pop(); rebuildOcc(); return 'Ça bloquerait le passage !'; }
 return null;
}
function editTap(x,y){
 if(placing){
  const F=FURN[placing];
  if(state.coins<F.p){ toast('Pas assez de pièces !'); placing=null; ghost=null; editBar(); return; }
  {
   const err=placeCheck(x,y,null,placing);
   if(err){ ghost={x,y}; toast(err); return; }
   state.nid++; state.coins-=F.p; sfx('pop'); floatAt(x,y,'-'+F.p,null,true); sparkle(x,y,8,'#ffffff');
   if(state.coins<F.p){ placing=null; ghost=null; }
   editBar(); hud(); return;
  }
 }
 const f=fAt(x,y);
 if(sel&&!f&&inRest(x,y)){
  const err=placeCheck(x,y,sel,null);
  if(err){ toast(err); return; } sfx('pop'); sel=null; ghost=null; editBar(); return;
 }
 if(f){ sel=(sel===f)?null:f; ghost=null; editBar(); return; }
 sel=null; ghost=null; editBar();
}

function fmtT(s){ s=Math.max(0,Math.ceil(s)); return s>=60?Math.floor(s/60)+' min '+(s%60?String(s%60).padStart(2,'0')+' s':''):s+' s'; }
function newQuestion(){

 ui.q=pick(pool.length?pool:QUIZ.map((_,i)=>i)); ui.qa=null; ui.qo=[0,1,2,3].sort(()=>Math.random()-.5);
}

 close:()=>closeModal(),

 role:id=>{ const s=state.staff.find(x=>x.id==id); const rs=Object.keys(ROLES).filter(r=>state.level>=ROLES[r].u); s.role=rs[(rs.indexOf(s.role)+1)%rs.length]; const a=crew.find(c=>c.s===s); if(a){ if(a.job&&a.job.o){ a.job.o.st='wait'; a.job.o.chef=null; a.job.o.waiter=null; a.job.o.at=null; } if(a.job&&a.job.stove) stoveBusy.delete(a.job.stove.id); if(a.job&&a.job.table) cleaning.delete(a.job.table.id); if(a.job&&a.job.t&&a.job.t.tg) a.job.t.tg=null; a.job=null; a.carry=null; a.path=[]; } },
 fire:id=>{ const s=state.staff.find(x=>x.id==id); if(!s||state.staff.length<=1) return; state.staff=state.staff.filter(x=>x!==s); resetSim(); crew=crew.filter(a=>a.s!==s); toast(s.name+' a quitté l\'équipe.'); },
 hire:r=>{ const c=hireCost(); if(state.coins<c||state.staff.length>=maxStaff()) return; state.coins-=c; const s=mkStaffData(r); state.staff.push(s); crew.push(mkCrew(s)); sfx('coin'); toast(ROLES[r].e+' '+s.name+' rejoint ton équipe !'); },
 ans:i=>{ i=+i; if(ui.qa!=null) return; ui.qa=i; state.quiz.n++; state.quiz.seen=[...(state.quiz.seen||[]),ui.q].slice(-15);
  if(i===0){ const rare=Object.keys(ING).filter(k=>ING[k].b), k=pick(rare), k2=pick(Object.keys(ING)); state.inv[k]=(state.inv[k]||0)+1; state.inv[k2]=(state.inv[k2]||0)+1; ui.qr=`+1 ${ING[k].e} +1 ${ING[k2].e}`; addXP(10); sfx('level'); } else sfx('bad'); },
 nextQ:()=>{ ui.q=null; ui.qa=null; },
 rename:()=>{ const v=($('#rname').value||'').trim().slice(0,16); if(v){ state.name=v; toast('Bienvenue « '+v+' » !'); } },
 sound:()=>{state.sound=!state.sound;},
 dn:()=>{state.daynight=!state.daynight;},
 recenter:()=>{centerCam(); closeModal();},
 reset:()=>{ if(!ui.cr){ui.cr=true; return;} ui.cr=false; try{localStorage.removeItem(SAVE_KEY);}catch(e){} state=newState(); setSize(); defaultLayout(); rebuildOcc(); custs=[];orders=[];trash=[];items=[];dirty.clear(); buildCrew(); centerCam(); closeModal(); showTuto(); },
};
$('#modal').addEventListener('click',e=>{
 if(e.target.id==='modal'||e.target.id==='mx') return closeModal();
 const b=e.target.closest('[data-a]'); if(!b) return;
 const a=b.dataset.a; if(ACT[a]){ ACT[a](b.dataset.v); if(ui.panel&&a!=='close'&&a!=='recenter'&&a!=='buy'&&a!=='expand') renderPanel(); hud(); }
});
document.querySelectorAll('[data-ic]').forEach(el=>el.innerHTML=svg(el.dataset.ic));
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{audioInit(); if(b.dataset.open==='quiz'){ui.q=null;} openPanel(b.dataset.open);});
$('#pRate').onclick=()=>openPanel('rating');
$('#pSet').onclick=()=>{ui.cr=false; openPanel('settings');};
$('#pLvl').onclick=()=>toast(`⭐ Niveau ${state.level} — ${Math.floor(state.xp)}/${xpNeed(state.level)} XP`);
$('#pCoins').onclick=()=>toast('Gagne des pièces en servant tes clients !');
let toastT=0;
function toast(s){ const t=$('#toast'); t.innerHTML=coinify(String(s).replace(/</g,'&lt;')); t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }
function hud(){
 $('#coins').textContent=fmt(state.coins); $('#lvl').textContent=state.level;
 $('#xpbar').style.width=(state.xp/xpNeed(state.level)*100)+'%';
 $('#rate').textContent=(Math.round(rating*10)/10).toFixed(1);
 const now=Date.now(); $('#gDot').classList.toggle('hide',!state.garden.some(p=>p&&(now-p.at)/1000>=ING[p.k].g.t));
 $('#qDot').classList.toggle('hide',quizLeft()<=0);
}
function showTuto(){
 queueModal(()=>({title:'Bienvenue dans Bistro Ville !',html:`<div class="hero">🧑‍🍳</div>
 <p>Tu viens d'ouvrir ton tout premier restaurant, <b>${state.name}</b>. Voici comment ça marche :</p>
 <div class="row"><div class="emo">🙋</div><div class="info">Les clients arrivent par la rue, s'assoient et commandent un plat de ton <b>menu</b>.</div></div>
 <div class="row"><div class="emo">👨‍🍳</div><div class="info">Ton <b>cuisinier</b> prépare le plat au fourneau, ton <b>serveur</b> l'apporte. Sers vite avant que les clients perdent patience !</div></div>
 <div class="row"><div class="emo">🌱</div><div class="info">Cultive des ingrédients au <b>Jardin</b> (ou gagne-les au <b>Quiz</b>) pour améliorer tes recettes.</div></div>
 <div class="row"><div class="emo">✏️</div><div class="info">Achète des meubles et décore en mode <b>Déco</b> pour faire monter ta <span class="stars">★</span> note.</div></div>
 <p class="sub">Fais glisser pour te déplacer, pince pour zoomer. Ta partie est sauvegardée automatiquement.</p>
 <p class="center"><button class="b" data-a="close">C'est parti !</button></p>`}));
 state.tuto=true;
}

/* ---------------- SON ---------------- */
let AC=null;
function audioInit(){ if(AC) return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function tone(f,t0,d,type,v){ const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(v||.08,AC.currentTime+t0); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t0+d); o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+t0); o.stop(AC.currentTime+t0+d+.02); }
function sfx(k){
 if(!state||!state.sound||!AC) return;
 try{
  if(k==='coin'){ tone(988,0,.08,'square',.04); tone(1319,.07,.16,'square',.04); }
  else if(k==='pop'){ tone(520,0,.08,'sine',.08); tone(780,.04,.08,'sine',.06); }
  else if(k==='level'){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.18,'triangle',.07)); }
  else if(k==='bad'){ tone(300,0,.15,'sawtooth',.04); tone(220,.12,.2,'sawtooth',.04); }
 }catch(e){}
}

/* ---------------- BOUCLE ---------------- */
let last=performance.now(),acc=0,saveAcc=0,gAcc=0;
function frame(t){
 const dt=Math.min(.1,(t-last)/1000); last=t;
 if(mode==='play') update(dt);
 updFx(dt);
 render();
 acc+=dt; if(acc>.5){ acc=0; calcRating(); hud(); }
 gAcc+=dt; if(gAcc>1){ gAcc=0; if(ui.panel==='garden'&&ui.tab==='potager'&&ui.plot==null) renderPanel(); }
 saveAcc+=dt; if(saveAcc>15){ saveAcc=0; save(); }
 requestAnimationFrame(frame);
}
function boot(){
 const loaded=load();
 state=loaded||newState();
 setSize();
 if(!loaded) defaultLayout();
 rebuildOcc(); buildCrew();
 resize(); centerCam(); makeThumbs(); calcRating(); hud();
 if(document.fonts&&document.fonts.load) document.fonts.load('600 15px Fredoka').catch(()=>{});
 if(!state.tuto) showTuto();
 else {
  const away=(Date.now()-state.lastSave)/1000;
  if(away>120){
   const mins=Math.min(away/60,480), avg=state.menu.reduce((s,id)=>s+dishPrice(DISHM[id]),0)/Math.max(1,state.menu.length);
   const gain=Math.floor(mins*Math.max(1,seatCount())*avg*.12);
   if(gain>0){ earn(gain); queueModal(()=>({title:'Bon retour !',html:`<div class="hero">💰</div><p class="center">Pendant ton absence (${fmtT(Math.min(away,28800))}), ton équipe a fait tourner <b>${state.name}</b> et a gagné<br><b style="font-size:26px">${fmt(gain)} 🪙</b></p><p class="center"><button class="b" data-a="close">Merci l'équipe !</button></p>`})); }
  }
 }
 save();
 requestAnimationFrame(frame);
}
addEventListener('resize',()=>{resize();});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
addEventListener('pagehide',save);
boot();
</script>
