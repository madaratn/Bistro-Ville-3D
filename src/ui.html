<style>
/*FONTS*/
:root{--accent:#ff7a2f;--accent2:#ff9f45;--ink:#3a2a1f;--muted:#8a7766;--panel:#fffcf7;--line:#f1e7da;--good:#2fae6e;--bad:#e5484d;--shadow:0 8px 24px rgba(80,45,15,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#a5d97a;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:500;color:var(--ink);touch-action:none;overscroll-behavior:none}
button{font-family:inherit}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.hide{display:none!important}
/* HUD */
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 10px 6px;display:flex;gap:7px;align-items:center;z-index:5;pointer-events:none}
.pill{background:rgba(255,252,247,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;height:38px;padding:0 13px 0 6px;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:7px;font-size:16px;pointer-events:auto;cursor:pointer;border:none;color:var(--ink)}
.pill.round{width:38px;padding:0;justify-content:center}
.pill.round svg{width:20px;height:20px;stroke:var(--ink)}
#spacer{flex:1}
.coin{display:inline-block;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c0 0,#ffd23f 38%,#f0a612 100%);box-shadow:inset 0 0 0 2.5px rgba(190,115,0,.35),0 2px 0 #c98a0c;flex-shrink:0;vertical-align:-6px}
.coin.sm{width:15px;height:15px;box-shadow:inset 0 0 0 1.5px rgba(190,115,0,.35),0 1.5px 0 #c98a0c;vertical-align:-2px;margin-left:2px}
.lvb{width:28px;height:28px;border-radius:50%;background:linear-gradient(145deg,#8f7bff,#5a46e0);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #3f2fb8}
.xpw{width:62px;height:8px;border-radius:9px;background:#eee4d6;overflow:hidden}
#xpbar{height:100%;width:0;background:linear-gradient(90deg,#8f7bff,#b59cff);border-radius:9px;transition:width .4s}
.star{width:24px;height:24px;background:linear-gradient(160deg,#ffe066,#ffb000);clip-path:polygon(50% 3%,62% 36%,97% 37%,69% 58%,79% 93%,50% 72%,21% 93%,31% 58%,3% 37%,38% 36%);flex-shrink:0}
/* Dock */
#bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:2px;z-index:5;background:rgba(255,252,247,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:7px;border-radius:26px;box-shadow:0 10px 30px rgba(80,45,15,.2)}
.nb{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:56px;padding:2px 0;cursor:pointer;color:var(--ink);font-size:11px;font-weight:600;position:relative}
.ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,var(--g1),var(--g2));box-shadow:0 3px 0 var(--g3),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s}
.ic svg{width:23px;height:23px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.nb:active .ic{transform:translateY(2px) scale(.96);box-shadow:0 1px 0 var(--g3)}
.dot{position:absolute;top:-3px;right:3px;width:16px;height:16px;border-radius:50%;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;font-style:normal;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
/* Barre déco */
#editbar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5;padding:0 10px}
#einfo{background:rgba(255,252,247,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:16px;padding:9px 15px;font-weight:500;font-size:14px;text-align:center;box-shadow:var(--shadow);max-width:520px}
.erow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* Boutons */
.b{border:none;border-radius:14px;padding:9px 15px;font-weight:600;font-size:14px;cursor:pointer;background:linear-gradient(180deg,#ff9a4d,#ff6f2b);color:#fff;box-shadow:0 3px 0 #d4561c,inset 0 1px 0 rgba(255,255,255,.35);display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.b:active{transform:translateY(2px);box-shadow:0 1px 0 #d4561c}
.b.alt{background:#fff;color:var(--ink);box-shadow:0 3px 0 #e6d9c8,inset 0 0 0 1.5px #efe4d6}
.b.green{background:linear-gradient(180deg,#45c983,#27a463);box-shadow:0 3px 0 #1c7d4a,inset 0 1px 0 rgba(255,255,255,.3)}
.b.red{background:linear-gradient(180deg,#f26b6f,#dd3f44);box-shadow:0 3px 0 #a5282c,inset 0 1px 0 rgba(255,255,255,.3)}
.b:disabled{opacity:.42;pointer-events:none;filter:grayscale(.3)}
.b.sm{padding:6px 11px;font-size:13px;border-radius:12px}
/* Fenêtre */
#modal{position:fixed;inset:0;background:rgba(45,25,10,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:86vh;border-radius:28px 28px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:up .28s cubic-bezier(.2,.9,.3,1.15);box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet::before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:#e7dccd;margin:9px auto 0}
@keyframes up{from{transform:translateY(60px);opacity:0}}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:28px;max-height:80vh}}
.mh{display:flex;align-items:center;gap:11px;padding:10px 16px 8px}
.mh .ic{width:38px;height:38px;border-radius:12px}
.mh .ic svg{width:21px;height:21px}
.mh h2{margin:0;font-size:21px;font-weight:600;flex:1}
#mx{border:none;background:#f3ebe0;border-radius:50%;width:36px;height:36px;font-size:15px;cursor:pointer;color:var(--ink);font-weight:600}
#tabs{display:flex;gap:4px;margin:2px 14px 10px;padding:4px;background:#f3ebe0;border-radius:14px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:1;border:none;border-radius:11px;padding:7px 11px;background:none;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer;font-size:14px}
#tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(80,45,15,.12)}
#mc{overflow-y:auto;padding:2px 14px 20px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#mc p{line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.card{background:#fff;border-radius:18px;padding:8px 8px 10px;text-align:center;box-shadow:0 4px 14px rgba(80,45,15,.07);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.card .pv{width:100%;height:80px;border-radius:13px;background:radial-gradient(circle at 50% 70%,#fff6e6,#f7ecdc);display:flex;align-items:center;justify-content:center}
.card img{width:78px;height:78px}
.card .nm{font-weight:600;line-height:1.15;min-height:2.3em;display:flex;align-items:center;font-size:14px}
.card.lock{opacity:.5}
.sub{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;background:#efe7ff;color:#5a46e0;border-radius:8px;padding:2px 7px}
.tag.gr{background:#e2f6ea;color:#1c7d4a}
.row{display:flex;align-items:center;gap:11px;background:#fff;border-radius:18px;padding:10px;margin-bottom:9px;box-shadow:0 4px 14px rgba(80,45,15,.06);border:1.5px solid var(--line)}
.row .emo{font-size:30px;width:50px;height:50px;border-radius:15px;background:#fbf3e7;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .info{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px}
.ings{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.ings span{font-size:12px;background:#f6efe5;border-radius:9px;padding:3px 7px;font-weight:500}
.ings span.no{background:#fde6e6;color:#b42a2f}
.ings span.ok{background:#e2f6ea;color:#1c7d4a}
.stars{color:#ffb000;letter-spacing:1px}
h3{margin:14px 0 8px;font-size:16px;font-weight:600}
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.plot{background:linear-gradient(170deg,#a77650,#8a5d3c);border-radius:18px;padding:9px;color:#fff;text-align:center;min-height:124px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15),0 4px 12px rgba(80,45,15,.12);font-weight:600}
.plot.ready{background:linear-gradient(170deg,#7cc35a,#559c3d)}
.plot.add{background:#f3ebe0;color:var(--muted);box-shadow:none;border:2px dashed #e0d2bf}
.plot .big{font-size:36px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.bar{width:100%;height:8px;background:rgba(0,0,0,.22);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#9ef07a,#5fd38a);border-radius:9px}
.qa{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.qa .b{justify-content:flex-start;font-size:15px;padding:12px 15px;white-space:normal;text-align:left}
.qa .b.alt.okk{background:#e2f6ea;box-shadow:0 3px 0 #2fae6e,inset 0 0 0 2px #2fae6e}
.qa .b.alt.bad{background:#fde6e6;box-shadow:0 3px 0 #e5484d,inset 0 0 0 2px #e5484d}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%) translateY(-8px);background:rgba(45,30,20,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;padding:9px 16px;border-radius:16px;font-weight:500;z-index:20;font-size:14px;transition:opacity .25s,transform .25s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:var(--shadow)}
#toast.on{opacity:1!important;transform:translateX(-50%)}
input[type=text]{font-family:inherit;font-size:16px;padding:9px 12px;border-radius:12px;border:2px solid var(--line);width:100%;-webkit-user-select:text;user-select:text;background:#fff;color:var(--ink)}
.center{text-align:center}
.hero{font-size:64px;text-align:center;margin:4px 0;filter:drop-shadow(0 6px 6px rgba(0,0,0,.15));animation:pop .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.sw{width:100%;height:80px;border-radius:13px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div class="pill" id="pCoins"><i class="coin"></i><span id="coins">0</span></div>
  <div class="pill" id="pLvl"><div class="lvb" id="lvl">1</div><div class="xpw"><div id="xpbar"></div></div></div>
  <div class="pill" id="pRate"><i class="star"></i><span id="rate">0</span></div>
  <div id="spacer"></div>
  <button class="pill round" id="pSet"><span data-ic="gear"></span></button>
</div>

<nav id="bottom">
  <button class="nb" data-open="shop"><i class="ic" style="--g1:#ffad4d;--g2:#ff7a2f;--g3:#d4561c" data-ic="shop"></i>Boutique</button>
  <button class="nb" data-open="menu"><i class="ic" style="--g1:#ff7d8a;--g2:#ef4f5f;--g3:#b8323f" data-ic="menu"></i>Menu</button>
  <button class="nb" data-open="garden"><i class="ic" style="--g1:#6fdc8c;--g2:#2fae6e;--g3:#1c7d4a" data-ic="garden"></i>Jardin<i class="dot hide" id="gDot">!</i></button>
  <button class="nb" data-open="staff"><i class="ic" style="--g1:#6db7ff;--g2:#3a82f0;--g3:#2559b8" data-ic="team"></i>Équipe</button>
  <button class="nb" data-open="quiz"><i class="ic" style="--g1:#b59cff;--g2:#7b5cf0;--g3:#5537c4" data-ic="quiz"></i>Quiz<i class="dot hide" id="qDot">!</i></button>
  <button class="nb" id="bEdit"><i class="ic" style="--g1:#4fd6cf;--g2:#18a9a3;--g3:#0f7c78" data-ic="edit"></i>Déco</button>
</nav>

<div id="editbar" class="hide">
  <div id="einfo"></div>
  <div class="erow" id="ebtns"></div>
</div>

<div id="modal" class="hide">
  <div class="sheet">
    <div class="mh"><i class="ic" id="mi"></i><h2 id="mt"></h2><button id="mx">✕</button></div>
    <div id="tabs"></div>
    <div id="mc"></div>
  </div>
</div>
<div id="toast" style="opacity:0"></div>
