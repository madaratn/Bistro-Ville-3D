name: APK Android

on:
  push:
    branches: [main]
    paths: ['www/**', 'capacitor.config.json', 'package.json', 'resources/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Version du jeu
        id: v
        run: |
          V=$(grep -o 'prototype v[0-9.]*' README.md | head -1 | sed 's/prototype v//')
          echo "name=${V:-0.0}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Projet Android (Capacitor)
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Icône
        continue-on-error: true
        run: |
          mkdir -p assets
          cp resources/icon.png assets/icon-only.png
          cp resources/icon.png assets/icon-foreground.png
          cp resources/icon.png assets/icon-background.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#8fd37a' --iconBackgroundColorDark '#8fd37a'
      - name: Réglages (version, portrait, clé de test)
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ steps.v.outputs.code }}/; s/versionName \"1.0\"/versionName \"${{ steps.v.outputs.name }}\"/" android/app/build.gradle
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          mkdir -p ~/.android && cp android-test/debug.keystore ~/.android/debug.keystore
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Construction de l'APK
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk chez-odette.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chez-odette-apk
          path: chez-odette.apk
      - name: Publier dans « Releases »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test chez-odette.apk --title "Chez Odette ${{ steps.v.outputs.name }} · APK Android de test" --notes "APK de test (non signé pour le Play Store). Sur le téléphone : télécharger chez-odette.apk, l'ouvrir, autoriser l'installation depuis cette source." --target "${{ github.sha }}"
